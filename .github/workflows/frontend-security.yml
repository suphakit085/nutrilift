name: Frontend security

on:
  push:
    branches: [main, security/frontend-dependencies-20261017]
    paths: ['frontend/**', 'backend/app/**', 'backend/uv.lock', 'eval/uat_browser/**', '.github/workflows/frontend-security.yml']
  pull_request:
    paths: ['frontend/**', 'backend/app/**', 'backend/uv.lock', 'eval/uat_browser/**', '.github/workflows/frontend-security.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend security checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_BASE: https://api.example.invalid
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --registry=https://registry.npmjs.org --audit-level=high
      - run: npm run lint
      - run: npx --no-install next typegen
      - run: npx --no-install tsc --noEmit
      - run: npm test
      - run: npm run build
      - name: Verify diary requests and recovery in Chrome
        run: npm run test:diary-ui
      - name: Verify responsive meal cards and warning access in Chrome
        run: npm run test:meal-ui
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.12.7'
          python-version: '3.12'
      - name: Install isolated account API test dependencies
        working-directory: backend
        run: uv sync --locked --extra dev
      - name: Verify account ownership, recovery and revocation in Chrome
        run: npm run test:account-ui
      - name: Verify dietary clarification and explicit persistence in Chrome
        run: npm run test:dietary-ui
      - name: Verify calculator provenance links and persisted answers in Chrome
        run: npm run test:target-ui
      - name: Verify health notices, recorded food states and budget limits in Chrome
        run: npm run test:quality-ui
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: frontend-browser-checks
          path: |
            output/playwright/diary-regressions/
            output/playwright/meal-card-regressions/
            output/playwright/account-regressions/
            output/playwright/dietary-regressions/
            output/playwright/target-citations/
            output/playwright/chat-quality/
          if-no-files-found: ignore
          retention-days: 14
