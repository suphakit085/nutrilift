name: Frontend security

on:
  push:
    branches: [main, security/frontend-dependencies-20261017]
    paths: ['frontend/**', 'eval/uat_browser/diary_requests.cjs', 'eval/uat_browser/run_diary_requests.mjs', '.github/workflows/frontend-security.yml']
  pull_request:
    paths: ['frontend/**', 'eval/uat_browser/diary_requests.cjs', 'eval/uat_browser/run_diary_requests.mjs', '.github/workflows/frontend-security.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend security checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_BASE: https://api.example.invalid
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --registry=https://registry.npmjs.org --audit-level=high
      - run: npm run lint
      - run: npx --no-install next typegen
      - run: npx --no-install tsc --noEmit
      - run: npm test
      - run: npm run build
      - name: Verify diary requests and recovery in Chrome
        run: npm run test:diary-ui
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: diary-browser-checks
          path: output/playwright/diary-regressions/
          if-no-files-found: ignore
          retention-days: 14
