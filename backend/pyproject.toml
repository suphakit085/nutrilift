[project]
name = "nutrilift-backend"
version = "0.1.0"
description = "Backend for a Thai weight-training nutrition chatbot (RAG + deterministic calculators)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.121.1",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3.6",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt<4.1",
    "python-multipart>=0.0.17",
    "google-genai>=2.20",
    # already pulled in by google-genai; listed because chat.py catches
    # httpx.TimeoutException directly (the SDK surfaces it unwrapped)
    "httpx>=0.27",
    "sse-starlette>=2.1",
    "python-frontmatter>=1.1",
    "pythainlp>=5.0",
    "pypdf>=5.0",
    "email-validator>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.8",
    "scipy>=1.14",
    # eval/build_review_workbooks.py - reviewer-facing Excel files
    "openpyxl>=3.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "ingest*"]

# Lint config lives in ../ruff.toml so it covers eval/ as well.
